name: Meta Client Production CI/CD

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: meta-client-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/${{ github.repository }}

permissions:
  contents: read

jobs:
  build:
    name: Build production client image
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    outputs:
      image-name: ${{ steps.image.outputs.name }}
      image-tag: ${{ steps.image.outputs.tag }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Generate image metadata
        id: image
        shell: bash
        run: |
          IMAGE_NAME="${IMAGE_NAME,,}"
          IMAGE_TAG="sha-${GITHUB_SHA}"

          echo "IMAGE_NAME=${IMAGE_NAME}" >> "${GITHUB_ENV}"
          echo "name=${IMAGE_NAME}" >> "${GITHUB_OUTPUT}"
          echo "tag=${IMAGE_TAG}" >> "${GITHUB_OUTPUT}"

          echo "Image: ${IMAGE_NAME}:${IMAGE_TAG}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish production image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.image.outputs.tag }}
          cache-from: type=gha,scope=meta-client-production
          cache-to: type=gha,mode=max,scope=meta-client-production

  deploy:
    name: Deploy production client
    needs:
      - build

    if: >
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    environment:
      name: production
      url: https://meta.nexeragroup.rw

    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Configure SSH
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
        run: |
          test -n "${SSH_PRIVATE_KEY}"
          test -n "${SSH_KNOWN_HOSTS}"

          install -m 700 -d "${HOME}/.ssh"
          printf '%s\n' "${SSH_PRIVATE_KEY}" > "${HOME}/.ssh/id_ed25519"
          chmod 600 "${HOME}/.ssh/id_ed25519"
          printf '%s\n' "${SSH_KNOWN_HOSTS}" > "${HOME}/.ssh/known_hosts"
          chmod 600 "${HOME}/.ssh/known_hosts"

      - name: Verify production server
        shell: bash
        env:
          SERVER_HOST: ${{ secrets.PROD_HOST }}
          SERVER_USER: ${{ secrets.PROD_USER }}
          SERVER_PORT: ${{ vars.PROD_SSH_PORT }}
          DEPLOY_PATH: ${{ vars.PROD_CLIENT_DEPLOY_PATH }}
        run: |
          SERVER_PORT="${SERVER_PORT:-22}"
          DEPLOY_PATH="${DEPLOY_PATH:-/home/yves/meta/client}"

          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 \
            -p "${SERVER_PORT}" "${SERVER_USER}@${SERVER_HOST}" \
            "set -e
             mkdir -p '${DEPLOY_PATH}' || { echo 'Cannot create deployment directory: ${DEPLOY_PATH}' >&2; exit 1; }
             test -w '${DEPLOY_PATH}' || { echo 'Deployment directory is not writable: ${DEPLOY_PATH}' >&2; exit 1; }
             command -v docker >/dev/null || { echo 'Docker is not installed or is not on PATH' >&2; exit 1; }
             docker version >/dev/null || { echo 'Docker daemon is unavailable for this SSH user' >&2; exit 1; }
             docker compose version >/dev/null || { echo 'Docker Compose is unavailable' >&2; exit 1; }"

      - name: Log production server in to GHCR
        shell: bash
        env:
          SERVER_HOST: ${{ secrets.PROD_HOST }}
          SERVER_USER: ${{ secrets.PROD_USER }}
          SERVER_PORT: ${{ vars.PROD_SSH_PORT }}
          GHCR_USERNAME: ${{ secrets.PROD_GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.PROD_GHCR_TOKEN }}
        run: |
          SERVER_PORT="${SERVER_PORT:-22}"
          test -n "${GHCR_USERNAME}"
          test -n "${GHCR_TOKEN}"

          printf '%s' "${GHCR_TOKEN}" | ssh -o BatchMode=yes \
            -o StrictHostKeyChecking=yes -o ConnectTimeout=15 \
            -p "${SERVER_PORT}" "${SERVER_USER}@${SERVER_HOST}" \
            "docker login ghcr.io --username '${GHCR_USERNAME}' --password-stdin"

      - name: Upload production deployment files
        shell: bash
        env:
          SERVER_HOST: ${{ secrets.PROD_HOST }}
          SERVER_USER: ${{ secrets.PROD_USER }}
          SERVER_PORT: ${{ vars.PROD_SSH_PORT }}
          DEPLOY_PATH: ${{ vars.PROD_CLIENT_DEPLOY_PATH }}
        run: |
          SERVER_PORT="${SERVER_PORT:-22}"
          DEPLOY_PATH="${DEPLOY_PATH:-/home/yves/meta/client}"

          test -f compose.prod.yml
          test -f scripts/deploy-production.sh

          scp -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 \
            -P "${SERVER_PORT}" compose.prod.yml scripts/deploy-production.sh \
            "${SERVER_USER}@${SERVER_HOST}:${DEPLOY_PATH}/"

      - name: Deploy production client
        shell: bash
        env:
          SERVER_HOST: ${{ secrets.PROD_HOST }}
          SERVER_USER: ${{ secrets.PROD_USER }}
          SERVER_PORT: ${{ vars.PROD_SSH_PORT }}
          DEPLOY_PATH: ${{ vars.PROD_CLIENT_DEPLOY_PATH }}
          IMAGE_NAME: ${{ needs.build.outputs.image-name }}
          IMAGE_TAG: ${{ needs.build.outputs.image-tag }}
        run: |
          SERVER_PORT="${SERVER_PORT:-22}"
          DEPLOY_PATH="${DEPLOY_PATH:-/home/yves/meta/client}"

          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 \
            -p "${SERVER_PORT}" "${SERVER_USER}@${SERVER_HOST}" \
            "set -e
             cd '${DEPLOY_PATH}'
             chmod +x deploy-production.sh
             ./deploy-production.sh '${IMAGE_NAME}' '${IMAGE_TAG}'"
