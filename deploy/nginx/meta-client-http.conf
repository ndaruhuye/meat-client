# Bootstrap HTTP site used only while issuing the Let's Encrypt certificate.
# Replace this file with meta-client.conf after the certificate is issued.
server {
    listen 80;
    listen [::]:80;
    server_name meta.nexeragroup.rw;
    access_log off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 503;
    }
}
