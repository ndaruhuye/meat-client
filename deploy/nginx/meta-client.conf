# Public HTTPS site for meta.nexeragroup.rw.
server {
    listen 80;
    listen [::]:80;
    server_name meta.nexeragroup.rw;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name meta.nexeragroup.rw;

    ssl_certificate /etc/letsencrypt/live/meta.nexeragroup.rw/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/meta.nexeragroup.rw/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 2m;

    add_header Strict-Transport-Security "max-age=31536000" always;

    # The gateway is published locally by its Compose stack on port 10160.
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:10160;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    # The Angular SSR client is published locally on port 10501.
    location / {
        proxy_pass http://127.0.0.1:10501;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}
