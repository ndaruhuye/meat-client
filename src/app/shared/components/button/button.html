<button
  class="button"
  [class.button--small]="size === 'small'"
  [class.button--medium]="size === 'medium'"
  [class.button--large]="size === 'large'"
  [class.button--solid]="appearance === 'solid'"
  [class.button--soft]="appearance === 'soft'"
  [class.button--outline]="appearance === 'outline'"
  [class.button--ghost]="appearance === 'ghost'"
  [class.button--link]="appearance === 'link'"
  [class.button--primary]="color === 'primary'"
  [class.button--gray]="color === 'gray'"
  [class.button--blue]="color === 'blue'"
  [class.button--green]="color === 'green'"
  [class.button--red]="color === 'red'"
  [class.button--yellow]="color === 'yellow'"
  [class.button--orange]="color === 'orange'"
  [class.button--purple]="color === 'purple'"
  [class.button--teal]="color === 'teal'"
  [class.button--success]="color === 'success'"
  [class.button--warning]="color === 'warning'"
  [class.button--danger]="color === 'danger'"
  [class.button--info]="color === 'info'"
  [class.button--full-width]="fullWidth"
  [class.button--icon-only]="iconOnly"
  [class.button--loading]="loading"
  [type]="type"
  [autofocus]="autofocus"
  [disabled]="interactionDisabled"
  [attr.name]="name ?? null"
  [attr.value]="value ?? null"
  [attr.aria-label]="ariaLabel ?? null"
  [attr.aria-disabled]="interactionDisabled ? 'true' : null"
  [attr.aria-busy]="loading ? 'true' : null"
  (click)="handleClick($event)"
>
  @if (loading) {
    <span class="button__spinner" aria-hidden="true"></span>
  }

  <span class="button__content">
    <ng-content />
  </span>
</button>

<span class="sr-only" role="status" aria-live="polite">{{ loading ? loadingLabel : '' }}</span>
